name: Astraea 4-Layer PR Review (Gemini)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base git ref/SHA"
        required: true
        default: "HEAD~1"
      head_ref:
        description: "Head git ref/SHA"
        required: true
        default: "HEAD"
      pr_number:
        description: "Optional PR number to post comment on"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  compiler-aware-pr-review:
    runs-on: ubuntu-latest
    env:
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Authenticate to Google Cloud (WIF, optional if GEMINI_API_KEY is set)
        if: ${{ env.GCP_WIF_PROVIDER != '' && env.GCP_PROJECT_ID != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install clang-18 and Astraea PR Bot
        run: |
          sudo apt-get update && sudo apt-get install -y clang-18
          python3 -m pip install --upgrade pip
          pip install "astraea-code-indexer[gcp] @ git+https://github.com/DharshanOB/astraea.git"

      - name: Run 4-Layer PR Analysis & Gemini Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENAI_USE_VERTEXAI: ${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.inputs.base_ref }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.event.inputs.head_ref }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
          GCP_LOCATION: ${{ vars.GCP_LOCATION || 'global' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-4-hydrogen' }}
        run: |
          extra_args=(--gemini-model "$GEMINI_MODEL")
          if [ -n "$GCP_PROJECT_ID" ]; then
            if [ -z "${GOOGLE_GENAI_USE_VERTEXAI:-}" ]; then
              export GOOGLE_GENAI_USE_VERTEXAI="true"
            fi
            extra_args+=(
              --vertex-project "$GCP_PROJECT_ID"
              --vertex-location "$GCP_LOCATION"
            )
          fi
          astraea-review \
            --mode pr \
            --repo . \
            --base "$BASE_REF" \
            --head "$HEAD_REF" \
            --out-md pr_review_summary.md \
            --out-deterministic-md pr_4layer_report.md \
            --out-gemini-md pr_gemini_review.md \
            --out-comments pr_review_comments.json \
            "${extra_args[@]}"
          cat pr_review_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Deterministic 4-Layer PR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-4layer-review
          path: pr_4layer_report.md
          retention-days: 30

      - name: Upload Detailed Gemini PR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-gemini-detailed-review
          path: pr_gemini_review.md
          retention-days: 30

      - name: Post PR Summary & Inline Review Comments
        if: ${{ github.event.pull_request.number != '' || github.event.inputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          HEAD_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess, sys
          repo = os.environ["REPO"]
          pr_num = os.environ["PR_NUMBER"]
          marker = "<!-- astraea-pr-review -->"
          with open("pr_review_summary.md", encoding="utf-8") as fh:
              summary_body = fh.read()
          if marker not in summary_body:
              summary_body = f"{marker}\n{summary_body}"

          existing_id = None
          list_proc = subprocess.run(
              [
                  "gh",
                  "api",
                  "--paginate",
                  f"repos/{repo}/issues/{pr_num}/comments?per_page=100",
                  "--jq",
                  f'.[] | select((.body // "") | contains("{marker}")) | .id',
              ],
              capture_output=True,
              text=True,
              check=False,
          )
          if list_proc.returncode == 0 and list_proc.stdout.strip():
              existing_id = list_proc.stdout.strip().splitlines()[0]

          payload = json.dumps({"body": summary_body})
          if existing_id is not None:
              subprocess.run(
                  [
                      "gh",
                      "api",
                      "--method",
                      "PATCH",
                      f"repos/{repo}/issues/comments/{existing_id}",
                      "--input",
                      "-",
                  ],
                  input=payload,
                  text=True,
                  check=True,
              )
          else:
              subprocess.run(
                  [
                      "gh",
                      "api",
                      f"repos/{repo}/issues/{pr_num}/comments",
                      "--input",
                      "-",
                  ],
                  input=payload,
                  text=True,
                  check=True,
              )

          with open("pr_review_comments.json", encoding="utf-8") as fh:
              comments = json.load(fh)
          failed = 0
          for c in comments[:15]:
              proc = subprocess.run([
                  "gh", "api",
                  f"repos/{repo}/pulls/{pr_num}/comments",
                  "-f", f"body={c['body']}",
                  "-f", f"commit_id={os.environ.get('HEAD_COMMIT_SHA', '')}",
                  "-f", f"path={c['path']}",
                  "-F", f"line={c['line']}",
                  "-f", f"side={c.get('side', 'RIGHT')}",
              ], capture_output=True, text=True, check=False)
              if proc.returncode != 0:
                  failed += 1
                  print(
                      f"::warning::Failed inline comment on {c['path']}:{c['line']}: {proc.stderr.strip()}",
                      file=sys.stderr,
                  )
          if failed:
              print(f"Inline comment posting completed with {failed} failure(s).", file=sys.stderr)
          EOF
