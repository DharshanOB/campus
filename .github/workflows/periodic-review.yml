name: Astraea Periodic & Manual Repository Review

on:
  schedule:
    # Runs daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      gemini_model:
        description: "Model to use (e.g. opencode-go/beam-free, gemini-3.5-flash-lite)"
        required: false
        default: "opencode-go/beam-free"

permissions:
  id-token: write
  contents: read

concurrency:
  group: periodic-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  periodic-repo-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install clang-18 and Astraea Reviewer
        run: |
          if ! command -v clang-18 >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-18
          fi
          python3 -m pip install --upgrade pip
          pip install "astraea-code-indexer[gcp] @ git+https://github.com/DharshanOB/astraea.git"

      - name: Restore Previous Review Baseline
        id: restore-baseline
        uses: actions/cache/restore@v6
        with:
          path: .astraea_baseline.json
          key: periodic-baseline-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            periodic-baseline-${{ github.ref_name }}-

      - name: Sign in to OpenCode
        continue-on-error: true
        env:
          AUDIENCE: https://opencode.ai/console
        run: |
          set -o pipefail
          oidc=$(curl -sSf --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          token=$(curl -sSf https://opencode.ai/console/auth/oauth/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            -d client_id=sk_abd545fd-6b67-48cd-beb9-eee6159ca921 \
            -d subject_token="$oidc" | jq -r .access_token)
          if [ -n "$token" ] && [ "$token" != "null" ]; then
            echo "::add-mask::$token"
            echo "OPENCODE_API_KEY=$token" >> "$GITHUB_ENV"
          fi

      - name: Install OpenCode CLI
        if: env.OPENCODE_API_KEY != ''
        run: |
          if ! command -v opencode >/dev/null 2>&1; then
            curl -fsSL https://opencode.ai/v2/install | bash -s -- --no-modify-path
            echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          fi

      - name: Run Full-Repository Audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ github.event.inputs.gemini_model || vars.GEMINI_MODEL || '' }}
        run: |
          if [ -z "$GEMINI_MODEL" ]; then
            if [ -n "${OPENCODE_API_KEY:-}" ]; then
              GEMINI_MODEL="opencode-go/beam-free"
            else
              GEMINI_MODEL="gemini-3.5-flash-lite"
            fi
          fi
          astraea-review \
            --mode repo \
            --repo . \
            --baseline .astraea_baseline.json \
            --out-baseline .astraea_baseline.json \
            --out-md repo_review_report.md \
            --out-deterministic-md deterministic_4layer_report.md \
            --out-gemini-md gemini_review_report.md \
            --out-comments repo_review_comments.json \
            --gemini-model "$GEMINI_MODEL"
          cat repo_review_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save Updated Review Baseline
        if: always() && hashFiles('.astraea_baseline.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .astraea_baseline.json
          key: periodic-baseline-${{ github.ref_name }}-${{ github.sha }}

      - name: Upload Deterministic 4-Layer Review Artifact
        uses: actions/upload-artifact@v7
        with:
          name: periodic-4layer-review
          path: deterministic_4layer_report.md
          retention-days: 30

      - name: Upload Detailed Gemini Review Artifact
        uses: actions/upload-artifact@v7
        with:
          name: periodic-gemini-detailed-review
          path: gemini_review_report.md
          retention-days: 30
